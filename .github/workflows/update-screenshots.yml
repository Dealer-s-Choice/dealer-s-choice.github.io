name: Update screenshots index

on:
  push:
    paths:
      - 'screenshots/**'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Regenerate screenshots/README.md
        run: |
          {
            echo "# Screenshots"
            echo ""
            for f in screenshots/*.png screenshots/*.gif; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              echo "[![$name]($name)]($name)"
              echo ""
            done
          } > screenshots/README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/README.md
          git diff --cached --quiet || git commit -m "Update screenshots index"
          git push
